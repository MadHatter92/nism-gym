      function CourseCard({ tag, title, description, bullets, onLearn, joinLink, priceOriginal, priceDiscount, className = "" }) {
        const imgSrc =
          title.includes("NISM XA") ? "nismxa.png" :
          title.includes("NISM XB") ? "nismxb.png" :
          title.includes("NISM XV") ? "nismxv.png" :
          title.includes("Combo") ? "combo.png" : null;

          <div className={`rounded-2xl border border-slate-200 bg-white p-7 shadow-sm hover:shadow-md transition-shadow ${className}`}>

            <h3 className="mt-3 text-lg font-bold">{title}</h3>
            <p className="mt-2 text-slate-600 text-sm">{description}</p>

            {imgSrc && <img src={imgSrc} alt={title} className="w-full h-44 object-cover rounded-xl mt-4" />}

            {(priceOriginal && priceDiscount) && (
              <div className="mt-4 flex items-baseline gap-2">
                <span className="text-sm text-slate-500 line-through">₹{priceOriginal}</span>
                <span className="text-xl font-extrabold text-slate-900">₹{priceDiscount}</span>
              </div>
            )}

            </ul>

                Join Now
              </a>
            </div>
          </div>
        );
      }
