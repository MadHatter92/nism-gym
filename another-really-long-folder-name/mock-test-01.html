<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NISM XB Mock Test 01 – Loading…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 0;
      color: #222;
    }
    .wrapper { max-width: 900px; margin: 0 auto; padding: 16px; }
    h1 { text-align: center; margin-bottom: 8px; }
    .intro, .test-container, .result-container {
      background: #fff; border-radius: 8px; padding: 16px 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05); margin-top: 12px;
    }
    .btn {
      padding: 8px 16px; border: none; border-radius: 4px;
      cursor: pointer; font-size: 14px;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .top-bar {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;
    }
    .timer {
      font-weight: 600; padding: 6px 10px;
      border-radius: 4px; background: #eff6ff; color: #1d4ed8;
    }
    .question-tracker {
      margin-bottom: 12px;
      border-radius: 6px;
      background: #f9fafb;
      padding: 8px 10px;
      border: 1px solid #e5e7eb;
    }
    .tracker-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .legend-color {
      width: 10px;
      height: 10px;
      border-radius: 2px;
    }
    .legend-answered { background: #22c55e; }
    .legend-review { background: #a855f7; }
    .legend-unanswered { background: #9ca3af; }
    .tracker-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      max-height: 120px;
      overflow-y: auto;
    }
    .tracker-item {
      min-width: 28px;
      height: 28px;
      border-radius: 4px;
      border: 1px solid #d1d5db;
      background: #f3f4f6;
      font-size: 12px;
      cursor: pointer;
    }
    .tracker-item.unanswered {
      background: #f3f4f6;
      color: #374151;
    }
    .tracker-item.answered {
      background: #dcfce7;
      border-color: #16a34a;
      color: #166534;
    }
    .tracker-item.review {
      background: #f3e8ff;
      border-color: #a855f7;
      color: #6b21a8;
    }
    .tracker-item.current {
      box-shadow: 0 0 0 2px #2563eb;
      border-color: #2563eb;
    }
    .question-text { font-weight: 500; margin-bottom: 8px; }
    .options label { display: block; margin-bottom: 6px; cursor: pointer; }
    .footer-actions {
      margin-top: 16px; display: flex; justify-content: space-between; gap: 8px;
    }
    .result-summary p { margin: 4px 0; }
    .badge {
      display: inline-block; padding: 2px 6px; border-radius: 4px;
      font-size: 11px; margin-left: 6px;
    }
    .badge-correct { background: #dcfce7; color: #15803d; }
    .badge-wrong { background: #fee2e2; color: #b91c1c; }
    .badge-unanswered { background: #e5e7eb; color: #374151; }

    /* Caselet styling */
    .caselet {
      background: #f9fafb;
      border-left: 4px solid #2563eb;
      padding: 8px 10px;
      margin-bottom: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>
<div class="wrapper">
  <h1>NISM XB Mock Test 01 – Loading…</h1>

  <!-- Intro Screen -->
  <div class="intro" id="intro">
    <p>Loading mock details…</p>
    <button class="btn btn-primary" id="startBtn">Start Test</button>
  </div>

  <!-- Test Screen -->
  <div class="test-container" id="testContainer" style="display:none;">
    <div class="top-bar">
      <div><strong>Mock Test – Loading…</strong></div>
      <div class="timer" id="timer">Time Left: 03:00:00</div>
    </div>

    <!-- Question Tracker -->
    <div class="question-tracker">
      <div class="tracker-legend">
        <div class="legend-item">
          <span class="legend-color legend-answered"></span> Answered
        </div>
        <div class="legend-item">
          <span class="legend-color legend-review"></span> Marked for Review
        </div>
        <div class="legend-item">
          <span class="legend-color legend-unanswered"></span> Unanswered
        </div>
      </div>
      <div class="tracker-grid" id="trackerGrid"></div>
    </div>

    <div id="questionBox"></div>

    <div class="footer-actions">
      <div>
        <button class="btn" id="prevBtn">Previous</button>
        <button class="btn" id="markBtn">Mark for Review</button>
        <button class="btn" id="nextBtn">Next</button>
      </div>
      <button class="btn btn-primary" id="submitBtn">Submit Paper</button>
    </div>
  </div>

  <!-- Result Screen -->
  <div class="result-container" id="resultContainer" style="display:none;">
    <h2>Test Result</h2>
    <div class="result-summary" id="resultSummary"></div>
    <div id="detailedFeedback"></div>
  </div>
</div>

<script>
const MOCK_JSON_PATH = "mock-xb-01.json"; // linked XB mock JSON

let mockData = null;
let questions = [];

let currentQ = 0;
let remainingSeconds = 0;
let timerInterval = null;
let testSubmitted = false;
const answers = {};
const markedForReview = new Set();

const introEl = document.getElementById("intro");
const testContainerEl = document.getElementById("testContainer");
const resultContainerEl = document.getElementById("resultContainer");
const timerEl = document.getElementById("timer");
const questionBoxEl = document.getElementById("questionBox");
const resultSummaryEl = document.getElementById("resultSummary");
const detailedFeedbackEl = document.getElementById("detailedFeedback");
const trackerGridEl = document.getElementById("trackerGrid");

const startBtn = document.getElementById("startBtn");
const submitBtn = document.getElementById("submitBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const markBtn = document.getElementById("markBtn");

async function loadMock() {
  try {
    const res = await fetch(MOCK_JSON_PATH);
    mockData = await res.json();
  } catch (e) {
    console.error("Error loading mock JSON:", e);
    const introP = introEl.querySelector("p");
    if (introP) {
      introP.textContent = "Error loading mock file. Please check that the JSON is in the same folder.";
    }
    return;
  }

  const mockTitle = mockData.title || "NISM XB Mock Test";
  document.title = mockTitle;
  const h1 = document.querySelector("h1");
  if (h1) h1.textContent = mockTitle;

  remainingSeconds = (mockData.durationMinutes || 180) * 60;

  questions = [];
  (mockData.questions || []).forEach((q) => {
    if (q.type === "mcq") {
      questions.push({
        id: q.id,
        text: q.text,
        options: q.options,
        correctIndex: q.correctIndex,
        marks: q.marks || 1,
        case_text: null
      });
    } else if (q.type === "large_caselet" || q.type === "small_caselet") {
      (q.questions || []).forEach((subQ) => {
        questions.push({
          id: subQ.qid,
          text: subQ.text,
          options: subQ.options,
          correctIndex: subQ.correctIndex,
          marks: q.marks_per_question || 2,
          case_text: q.case_text || ""
        });
      });
    }
  });

  const topBarLabel = document.querySelector(".top-bar strong");
  if (topBarLabel) topBarLabel.textContent = `${mockTitle} – ${questions.length} Questions`;

  const introP = introEl.querySelector("p");
  if (introP) {
    introP.textContent = `This mock has ${questions.length} questions, ${mockData.durationMinutes} minutes, ${mockData.negativeMarking} negative marking per wrong answer.`;
  }
}

function formatTime(seconds){
  const m = Math.floor(seconds/60), s = seconds%60;
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function startTimer(){
  timerEl.textContent = "Time Left: " + formatTime(remainingSeconds);
  timerInterval = setInterval(()=>{
    remainingSeconds--;
    if(remainingSeconds <= 0){
      clearInterval(timerInterval);
      if (!testSubmitted) submitTest(true);
    } else {
      timerEl.textContent = "Time Left: " + formatTime(remainingSeconds);
    }
  },1000);
}

function renderQuestion(){
  const q = questions[currentQ];
  questionBoxEl.innerHTML = `
    ${q.case_text ? `<div class="caselet"><strong>Caselet:</strong> ${q.case_text}</div>` : ""}
    <div class="question-text">${currentQ+1}. ${q.text}</div>
    <div class="options">
      ${q.options.map((opt,i)=>`
        <label>
          <input type="radio" name="q" value="${i}" ${answers[q.id]===i?'checked':''}>
          ${opt}
        </label>
      `).join("")}
    </div>
    ${markedForReview.has(q.id)?'<p><em>Marked for Review</em></p>':""}
  `;
  prevBtn.disabled = currentQ===0;
  nextBtn.disabled = currentQ===questions.length-1;
  renderTracker();
}

function captureAnswer(){
  const sel = document.querySelector("input[name='q']:checked");
  if(sel) answers[questions[currentQ].id] = parseInt(sel.value, 10);
}

function renderTracker(){
  trackerGridEl.innerHTML = "";
  questions.forEach((q, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = i + 1;
    btn.className = "tracker-item";
    if (markedForReview.has(q.id)) btn.classList.add("review");
    else if (answers[q.id] !== undefined) btn.classList.add("answered");
    else btn.classList.add("unanswered");
    if (i === currentQ) btn.classList.add("current");
    btn.addEventListener("click", () => { captureAnswer(); currentQ = i; renderQuestion(); });
    trackerGridEl.appendChild(btn);
  });
}

function submitTest(auto=false){
  testSubmitted = true;
  clearInterval(timerInterval);
  testContainerEl.style.display = "none";
  resultContainerEl.style.display = "block";

  let correct = 0, wrong = 0, unanswered = 0;
  const neg = (mockData && typeof mockData.negativeMarking === "number") ? mockData.negativeMarking : 0.25;
  detailedFeedbackEl.innerHTML = "";

  questions.forEach((q,i)=>{
    const ans = answers[q.id];
    let status, badge;
    if(ans === undefined){ unanswered++; status="Unanswered"; badge="badge-unanswered"; }
    else if(ans === q.correctIndex){ correct++; status="Correct"; badge="badge-correct"; }
    else { wrong++; status="Wrong"; badge="badge-wrong"; }
    const row = document.createElement("p");
    row.innerHTML = `${i+1}. ${q.text}<span class="badge ${badge}">${status}</span>`;
    detailedFeedbackEl.appendChild(row);
  });
  const score = correct - (wrong*neg);
  resultSummaryEl.innerHTML = `
    <p><strong>Total:</strong> ${questions.length}</p>
    <p>Correct: ${correct}, Wrong: ${wrong}, Unanswered: ${unanswered}</p>
    <p><strong>Final Score:</strong> ${score.toFixed(2)}</p>
    ${auto ? "<p><em>Auto-submitted on timeout.</em></p>" : ""}
  `;
  resultContainerEl.scrollIntoView({behavior:"smooth"});
}

startBtn.onclick = () => {
  if (!questions.length) {
    alert("Questions are still loading. Please wait a moment and try again.");
    return;
  }
  introEl.style.display = "none";
  testContainerEl.style.display = "block";
  startTimer();
  renderQuestion();
};
nextBtn.onclick = () => { captureAnswer(); if(currentQ < questions.length-1){ currentQ++; renderQuestion(); } };
prevBtn.onclick = () => { captureAnswer(); if(currentQ > 0){ currentQ--; renderQuestion(); } };
markBtn.onclick = () => { const q = questions[currentQ]; if(markedForReview.has(q.id)) markedForReview.delete(q.id); else markedForReview.add(q.id); renderQuestion(); };
submitBtn.onclick = () => { if(confirm("Submit the paper?")) submitTest(false); };

loadMock();
</script>
</body>
</html>
